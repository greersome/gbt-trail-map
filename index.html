<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16181A">
<title>Trail Stake — Location</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#16181A;      /* calm dark for setup screens */
    --char-2:#22262A;
    --line:#3A3F45;
    --stop:#D6382B;      /* high-vis red */
    --hold:#E8850C;      /* safety amber */
    --go:#17864A;        /* signal green */
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Barlow",system-ui,sans-serif;
    background:var(--char);color:var(--white);
    min-height:100%;display:flex;flex-direction:column;
    transition:background .5s ease;
  }
  .pad{
    padding:
      calc(env(safe-area-inset-top) + 22px)
      calc(env(safe-area-inset-right) + 22px)
      calc(env(safe-area-inset-bottom) + 24px)
      calc(env(safe-area-inset-left) + 22px);
    flex:1;display:flex;flex-direction:column;max-width:560px;margin:0 auto;width:100%;
  }
  .cond{font-family:"Barlow Semi Condensed",sans-serif}
  .eyebrow{font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
  h1{font-family:"Barlow Semi Condensed";font-weight:800;font-size:34px;line-height:1;letter-spacing:-.01em;margin-top:6px;text-transform:uppercase}
  .lede{font-size:17px;opacity:.8;margin-top:12px;max-width:40ch}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0}

  button{font-family:"Barlow Semi Condensed",sans-serif;cursor:pointer;border:none;font-weight:800}
  .btn{
    width:100%;padding:24px;border-radius:18px;font-size:23px;letter-spacing:.02em;
    text-transform:uppercase;background:var(--white);color:var(--char);
    transition:transform .08s ease,opacity .15s;
  }
  .btn:active{transform:translateY(2px)}
  .btn[disabled]{opacity:.35}
  .btn.dark{background:var(--char-2);color:var(--white);border:2px solid var(--line)}
  .btn + .btn{margin-top:14px}

  .card{background:var(--char-2);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
  .card h2{font-family:"Barlow Semi Condensed";font-size:22px;font-weight:800;text-transform:uppercase}
  .card p{opacity:.8;font-size:16px;margin-top:6px}
  ol.steps{list-style:none;counter-reset:s;margin-top:16px}
  ol.steps li{counter-increment:s;position:relative;padding:14px 0 14px 46px;font-size:18px;border-top:1px solid var(--line)}
  ol.steps li:first-child{border-top:none}
  ol.steps li::before{content:counter(s);font-family:"Barlow Semi Condensed";font-weight:800;font-size:20px;position:absolute;left:0;top:12px;width:30px;height:30px;border-radius:8px;background:var(--white);color:var(--char);text-align:center;line-height:30px}
  ol.steps b{font-weight:700}
  .switch{width:100%;text-align:center;font-size:15px;opacity:.55;background:none;color:var(--white);margin-top:6px;padding:10px;text-decoration:underline;font-family:"Barlow"}

  /* ---- full-flood live status ---- */
  body.flood{background:var(--stop)}
  body.flood.amber{background:var(--hold)}
  body.flood.green{background:var(--go)}
  .live{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .statusline{font-family:"Barlow Semi Condensed";font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
  .pip{width:14px;height:14px;border-radius:50%;background:var(--white);animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  .bignum{font-family:"Barlow Semi Condensed";font-weight:800;font-size:150px;line-height:.85;letter-spacing:-.04em;margin:14px 0 0;font-variant-numeric:tabular-nums}
  .bignum small{font-size:44px;opacity:.7;font-weight:700}
  .sub{font-size:18px;opacity:.85;margin-top:6px;max-width:26ch}
  .coords{font-family:"Space Mono",monospace;font-size:14px;opacity:.7;margin-top:22px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .live .btn{background:var(--white);color:var(--char);margin-top:32px}

  .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;margin:0 auto}
  @keyframes rot{to{transform:rotate(360deg)}}
  .foot{font-size:14px;opacity:.55;text-align:center;margin-top:16px}
  .hidden{display:none!important}
</style>
</head>
<body>
  <div class="pad" id="pad">
    <header id="head">
      <div class="eyebrow">Greenbay Trail Day</div>
      <h1 id="title">Location</h1>
      <p class="lede" id="lede">Let's make sure your phone can pin each stake before you start.</p>
    </header>
    <main class="stage" id="stage"><div class="spin"></div></main>
  </div>

<script>
  const GREEN=8, AMBER=20;
  const stage=document.getElementById('stage');
  const head=document.getElementById('head');
  const titleEl=document.getElementById('title');
  const ledeEl=document.getElementById('lede');
  let watchId=null, best=Infinity, lastFixTs=0, manualPlatform=null;

  function platform(){
    if(manualPlatform) return manualPlatform;
    const ua=navigator.userAgent;
    const iOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(iOS) return 'ios'; if(/Android/.test(ua)) return 'android'; return 'other';
  }
  function platName(){return {ios:'iPhone',android:'Android',other:'this device'}[platform()];}
  function unflood(){document.body.classList.remove('flood','amber','green');head.classList.remove('hidden');}

  function boot(){
    if(!('geolocation' in navigator)) return render('unsupported');
    if(!window.isSecureContext) return render('insecure');
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(r=>{route(r.state);r.onchange=()=>route(r.state);}).catch(()=>render('intro'));
    } else render('intro');
  }
  function route(s){ s==='granted'?startWatch():s==='denied'?render('blocked'):render('intro'); }

  function requestOnce(){render('acquiring');navigator.geolocation.getCurrentPosition(()=>startWatch(),onError,{enableHighAccuracy:true,maximumAge:0,timeout:20000});}
  function startWatch(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);best=Infinity;render('acquiring');watchId=navigator.geolocation.watchPosition(onFix,onError,{enableHighAccuracy:true,maximumAge:0,timeout:20000});}
  function onFix(p){const a=p.coords.accuracy;if(a<best)best=a;lastFixTs=Date.now();document.getElementById('bignum')?updateLive(p.coords):render('live',p.coords);}
  function onError(e){if(e.code===1)render('blocked');else if(e.code===2)render('unavailable');else if(!document.getElementById('bignum'))render('acquiring');}
  function recheck(){unflood();boot();}

  function render(view,coords){
    unflood();
    titleEl.textContent='Location'; ledeEl.classList.remove('hidden');

    if(view==='intro'){
      ledeEl.textContent="Let's make sure your phone can pin each stake before you start.";
      stage.innerHTML=`
        <div class="card"><h2>What happens next</h2><p>Your phone will ask to use your location. Tap <b>Allow</b> — it's used only while you place stakes.</p></div>
        <button class="btn" id="go">Turn on location</button>
        <p class="foot">Nothing saves until you confirm a good fix.</p>`;
      document.getElementById('go').onclick=requestOnce;
    }
    else if(view==='acquiring'){
      titleEl.textContent='Finding signal';
      ledeEl.textContent='Up to a minute on a cold start. Step into the open if you can.';
      stage.innerHTML=`<div class="spin"></div><p class="foot" style="margin-top:20px">Accuracy sharpens as satellites lock in.</p>`;
    }
    else if(view==='blocked'){
      titleEl.textContent='Location blocked';
      ledeEl.textContent='This browser is denying location. Switch it back on:';
      stage.innerHTML=stepsCard()+`<button class="btn" id="re">I've done this — recheck</button><button class="switch" id="sw">Not ${platName()}? Other steps</button>`;
      wireRecheck();
    }
    else if(view==='unavailable'){
      titleEl.textContent="No fix yet";
      ledeEl.textContent="Permission's on, but nothing's coming through — usually the phone's main Location switch is off.";
      stage.innerHTML=servicesCard()+`<button class="btn" id="re">Recheck</button><button class="switch" id="sw">Not ${platName()}? Other steps</button>`;
      wireRecheck();
    }
    else if(view==='live'){
      head.classList.add('hidden');
      document.body.classList.add('flood');
      stage.innerHTML=`
        <div class="live">
          <div class="statusline"><span class="pip"></span><span id="statusword">Searching</span></div>
          <div class="bignum" id="bignum">—<small>m</small></div>
          <div class="sub" id="sub">Hold still in the open</div>
          <div class="coords"><span id="coords">lat — · lon —</span><span id="ago">live</span><span id="bestv">best —</span></div>
          <button class="btn" id="continue" disabled>Confirm &amp; continue</button>
        </div>`;
      document.getElementById('continue').onclick=()=>render('ready');
      if(coords)updateLive(coords);
      tickClock();
    }
    else if(view==='ready'){
      if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
      head.classList.add('hidden');
      document.body.classList.add('flood','green');
      stage.innerHTML=`
        <div class="live">
          <div class="bignum" style="font-size:100px">✓</div>
          <h1 style="font-size:40px">Ready to stake</h1>
          <p class="sub">Best this session: ±${best.toFixed(1)} m — good enough to map.</p>
          <p class="foot" style="opacity:.8;margin-top:20px">Next: photograph the stake and enter its number.</p>
          <button class="btn dark" id="back" style="margin-top:24px">Back to live readout</button>
        </div>`;
      document.getElementById('back').onclick=()=>startWatch();
    }
    else if(view==='insecure'){
      titleEl.textContent='Needs https';
      ledeEl.textContent='Phones only share location over a secure connection. Open this from its https link — the one behind the trail QR code.';
      stage.innerHTML=`<div class="card"><h2>Not secure</h2><p>This address isn't https, so location is disabled here.</p></div>`;
    }
    else if(view==='unsupported'){
      titleEl.textContent='Browser too old';
      ledeEl.textContent='Try Safari on iPhone or Chrome on Android.';
      stage.innerHTML='';
    }
  }

  function updateLive(c){
    const a=c.accuracy, acc=Math.round(a);
    document.getElementById('bignum').innerHTML=`${acc}<small>m</small>`;
    document.getElementById('coords').textContent=`lat ${c.latitude.toFixed(5)} · lon ${c.longitude.toFixed(5)}`;
    document.getElementById('bestv').textContent='best ±'+best.toFixed(1)+'m';
    document.body.classList.remove('amber','green');
    let word,sub;
    if(a<=GREEN){document.body.classList.add('green');word='Locked in';sub='Great fix — tap confirm';}
    else if(a<=AMBER){document.body.classList.add('amber');word='Close — hold steady';sub='Stand still to tighten it up';}
    else{word='Searching';sub='Too coarse — move into the open';}
    document.getElementById('statusword').textContent=word;
    document.getElementById('sub').textContent=sub;
    const btn=document.getElementById('continue');
    if(a<=AMBER){btn.disabled=false;btn.textContent=a<=GREEN?'Confirm & continue':'Confirm anyway (±'+acc+'m)';}
    else btn.disabled=true;
  }
  function tickClock(){
    clearInterval(window.__c);
    window.__c=setInterval(()=>{const el=document.getElementById('ago');if(!el){clearInterval(window.__c);return;}
      const s=Math.round((Date.now()-lastFixTs)/1000);el.textContent=lastFixTs===0?'waiting':(s<2?'live':s+'s ago');},1000);
  }

  function stepsCard(){
    const p=platform();
    if(p==='ios')return`<div class="card"><h2>iPhone · Safari</h2><ol class="steps"><li>Tap <b>ᴀA</b> at the left of the address bar</li><li>Choose <b>Website Settings</b></li><li>Set <b>Location</b> to <b>Allow</b></li><li>Come back and recheck</li></ol></div>`;
    if(p==='android')return`<div class="card"><h2>Android · Chrome</h2><ol class="steps"><li>Tap the <b>lock / tune icon</b> by the address bar</li><li>Open <b>Permissions → Location</b></li><li>Choose <b>Allow</b></li><li>Come back and recheck</li></ol></div>`;
    return`<div class="card"><h2>In your browser</h2><ol class="steps"><li>Tap the <b>site-info icon</b> by the address bar</li><li>Open <b>Site settings / Permissions</b></li><li>Set <b>Location</b> to <b>Allow</b>, then recheck</li></ol></div>`;
  }
  function servicesCard(){
    const p=platform();
    if(p==='ios')return`<div class="card"><h2>Turn on Location Services</h2><ol class="steps"><li>Open the <b>Settings</b> app</li><li>Go to <b>Privacy &amp; Security → Location Services</b></li><li>Switch <b>Location Services</b> on</li><li>Set your browser to <b>While Using</b></li><li>Turn on <b>Precise Location</b></li><li>Return and recheck</li></ol></div>`;
    if(p==='android')return`<div class="card"><h2>Turn on Location</h2><ol class="steps"><li>Swipe down to <b>Quick Settings</b></li><li>Tap <b>Location</b> to turn it on</li><li>In <b>Settings → Location</b>, enable <b>Location Accuracy</b></li><li>Return and recheck</li></ol></div>`;
    return`<div class="card"><h2>Turn on Location Services</h2><ol class="steps"><li>Open device <b>Settings</b></li><li>Turn on the system <b>Location</b> switch</li><li>Return and recheck</li></ol></div>`;
  }
  function wireRecheck(){
    document.getElementById('re').onclick=recheck;
    const sw=document.getElementById('sw');
    if(sw)sw.onclick=()=>{const o=['ios','android','other'];manualPlatform=o[(o.indexOf(platform())+1)%o.length];render(titleEl.textContent.includes('blocked')?'blocked':'unavailable');};
  }

  boot();
</script>
</body>
</html>
